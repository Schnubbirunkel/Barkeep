<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Barkeep</title>
  <meta name="description" content="Deine Hausbar in der Hosentasche – Cocktailrezepte, Meine Bar, Was kann ich mixen?">
  <meta name="theme-color" content="#0E1320">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Barkeep">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0E1320; overscroll-behavior: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { touch-action: none; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #0E1320; color: #E9E4F5; font: 15px -apple-system, system-ui, sans-serif; z-index: 10; transition: opacity .35s; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash-msg { opacity: .7; text-align: center; padding: 0 24px; }
    .bk-scan { position: fixed; inset: 0; background: #000; z-index: 20; }
    .bk-scan video { width: 100%; height: 100%; object-fit: cover; }
    .bk-scan-frame { position: absolute; left: 10%; right: 10%; top: 38%; height: 24%; border: 3px solid rgba(255,255,255,.85);
      border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
    .bk-scan-close { position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 16px; width: 48px; height: 48px;
      border-radius: 24px; border: 0; background: rgba(255,255,255,.2); color: #fff; font-size: 22px; }
  </style>
  <script src="platform.js"></script>
  <script src="barkeep.js" defer></script>
</head>
<body>
  <div id="splash">
    <img src="icons/icon-192.png" alt="">
    <div id="splash-msg">Barkeep wird geladen …</div>
  </div>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
    // Kotlin/Wasm with GC needs a current browser (Safari 18.2+, Chrome 119+, Firefox 120+).
    if (typeof WebAssembly !== 'object' || !WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,95,1,120,0]))) {
      document.getElementById('splash-msg').textContent =
        'Dieser Browser ist zu alt für Barkeep. Bitte iOS/Safari bzw. den Browser aktualisieren. / This browser is too old for Barkeep.';
    }
  </script>
</body>
</html>
