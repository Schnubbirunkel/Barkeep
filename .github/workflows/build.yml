name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"; else NAME="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Unit tests & screenshots
        run: gradle :app:recordRoborazziDebug --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease -PversionName=${{ steps.v.outputs.name }} -PversionCode=${{ github.run_number }} --stacktrace

      - name: Collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Barkeep-${{ steps.v.outputs.name }}.apk
          cd docs/screenshots && zip -r ../../out/screenshots.zip . && cd ../..

      - uses: actions/upload-artifact@v4
        with:
          name: barkeep-${{ steps.v.outputs.name }}
          path: |
            out/*
            docs/screenshots/**

      - name: Commit screenshots
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || (git commit -m "docs: update screenshots [skip ci]" && git push)

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Barkeep-${{ steps.v.outputs.name }}.apk
            out/screenshots.zip
            docs/screenshots/de/*.png
          body_path: RELEASE_NOTES.md
